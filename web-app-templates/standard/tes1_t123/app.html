<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Well Log Analysis</title>
    <link id="favicon" rel="icon" href="" />
    <style>
      html, body { height: 100%; margin: 0; padding: 0; }
      #app { height: 100%; width: 100%; }
      body { overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Next.js static content will be loaded here -->
    </div>

    <script>
      (function () {
        // Helper to build URLs to /resources with a local fallback (for local preview)
        var _getResUrl = (typeof window.getWebAppResourceUrl === 'function')
          ? window.getWebAppResourceUrl
          : function (p) { p = (p || '').replace(/^\//, ''); return '/resources/' + p; };
        function resUrl(p) { return _getResUrl(p); }

        var baseOut = resUrl('out/');
        if (!/\/$/.test(baseOut)) baseOut += '/';

        // Set favicon
        document.getElementById('favicon').href = baseOut + 'favicon.ico';

        // Load the main Next.js static files
        function loadStaticApp() {
          // Load CSS files
          var cssFiles = [
            baseOut + '_next/static/css/app/layout.css',
            baseOut + '_next/static/css/app/dashboard/page.css'
          ];

          cssFiles.forEach(function(href) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href;
            document.head.appendChild(link);
          });

          // Load main JavaScript files
          var jsFiles = [
            baseOut + '_next/static/chunks/webpack.js',
            baseOut + '_next/static/chunks/main.js',
            baseOut + '_next/static/chunks/pages/_app.js'
          ];

          var loadedCount = 0;
          jsFiles.forEach(function(src) {
            var script = document.createElement('script');
            script.src = src;
            script.onload = function() {
              loadedCount++;
              if (loadedCount === jsFiles.length) {
                // All scripts loaded, now load the main app content
                loadAppContent();
              }
            };
            document.head.appendChild(script);
          });
        }

        function loadAppContent() {
          // Fetch and inject the main HTML content
          fetch(baseOut + 'index.html', { credentials: 'same-origin' })
            .then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.text();
            })
            .then(function (html) {
              // Extract the body content and inject it
              var parser = new DOMParser();
              var doc = parser.parseFromString(html, 'text/html');
              var bodyContent = doc.body.innerHTML;

              // Rewrite asset URLs to use Dataiku's resource paths
              bodyContent = bodyContent.replace(
                /(src|href)=["']\/_next/g,
                '$1="' + baseOut.replace(/\/$/, '') + '/_next'
              );

              document.getElementById('app').innerHTML = bodyContent;

              // Initialize the Next.js app
              if (window.__NEXT_DATA__ && window.__NEXT_DATA__.buildId) {
                // Set up API proxy for Dataiku backend
                setupApiProxy();
              }
            })
            .catch(function (error) {
              console.error('Failed to load app content:', error);
              document.getElementById('app').innerHTML = '<div style="padding: 20px;"><h2>Well Log Analysis</h2><p>Failed to load application. Please check the console for errors.</p></div>';
            });
        }

        function setupApiProxy() {
          // Override fetch to proxy API calls to Dataiku backend
          var originalFetch = window.fetch;
          window.fetch = function(url, options) {
            if (typeof url === 'string' && url.includes('/api/')) {
              // Convert API calls to use Dataiku's backend URL
              var backendUrl = (typeof window.getWebAppBackendUrl === 'function')
                ? window.getWebAppBackendUrl(url.replace('/api/', ''))
                : url;
              return originalFetch(backendUrl, options);
            }
            return originalFetch(url, options);
          };
        }

        // Start loading the application
        loadStaticApp();
      })();
    </script>
  </body>
</html>
