# Dataiku Well Log Analysis Plugin Configuration

# This file contains configuration settings for the plugin
# Copy this to your Dataiku plugin directory and modify as needed

[plugin]
# Plugin metadata
name = Well Log Analysis
version = 0.0.1
description = Interactive well log analysis and visualization

[paths]
# Default paths for well data (modify these for your environment)
wells_base_path = /path/to/well/data
structures_path = /path/to/structures
output_path = /path/to/output

[api]
# API configuration
max_file_size_mb = 100
timeout_seconds = 300
max_concurrent_jobs = 5

[logging]
# Logging configuration
log_level = INFO
log_file = well_log_analysis.log

[modules]
# Enable/disable specific analysis modules
vsh_calculation = true
porosity_calculation = true
sw_calculation = true
crossplot_analysis = true
histogram_analysis = true
data_splicing = true
quality_control = true
depth_matching = true

[defaults]
# Default parameters for calculations
default_vsh_gr_ma = 100.0
default_vsh_gr_sh = 200.0
default_porosity_matrix_density = 2.65
default_porosity_fluid_density = 1.0
default_sw_archie_a = 1.0
default_sw_archie_m = 2.0
default_sw_archie_n = 2.0
